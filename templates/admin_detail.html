<!DOCTYPE html>
<html>
<head>
    <title>Detail Pegawai</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-4">
        <h2>👤 Detail Pegawai</h2>
        <a href="/admin" class="btn btn-outline-secondary mb-3">← Kembali</a>
        <div class="card">
            <div class="card-body">
                <p><strong>Nama:</strong> {{ pegawai.nama }}</p>
                <p><strong>Usia:</strong> {{ pegawai.usia or '-' }}</p>
                <p><strong>Jenis Kelamin:</strong> {{ pegawai.jenis_kelamin or '-' }}</p>
                <p><strong>Tanggal Tes:</strong> {{ pegawai.tanggal_tes or '-' }}</p>
            </div>
        </div>
    </div>
</body>
</html>
