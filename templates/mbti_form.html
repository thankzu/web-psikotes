<!DOCTYPE html>
<html>
<head>
    <title>Tes MBTI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-4">
        <h2 class="mb-4">🧩 Tes MBTI</h2>
        <p class="text-muted">Pilih salah satu pernyataan (A atau B).</p>
        <form method="POST" action="/mbti">
            <input type="hidden" name="pegawai_id" value="{{ pegawai_id }}">
            {% for item in soal %}
            <div class="card mb-2">
                <div class="card-body">
                    <strong>{{ item.nomor }}.</strong>
                    <div class="form-check">
                        <input type="radio" name="mbti_{{ item.nomor }}" value="A" class="form-check-input" required>
                        <label class="form-check-label">A. {{ item.A }}</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" name="mbti_{{ item.nomor }}" value="B" class="form-check-input" required>
                        <label class="form-check-label">B. {{ item.B }}</label>
                    </div>
                </div>
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary btn-lg w-100 mt-3">Submit</button>
        </form>
    </div>
</body>
</html>
